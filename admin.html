<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration THN</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div class="box" style="max-width:520px;margin:60px auto">
    <p><a href="/">← Accueil</a></p>
    <h1>🔐 Administration THN</h1>
    <p class="muted">Accès réservé à l'administration du parc matériel.</p>
    <form method="post" action="/.netlify/functions/admin">
      <input type="hidden" name="action" value="login">
      <label>Mot de passe administrateur</label>
      <input type="password" name="password" autocomplete="current-password" required autofocus>
      <button type="submit">Accéder</button>
    </form>
  </div>
</main>
</body>
</html>
