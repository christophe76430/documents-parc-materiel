[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/machine/*"
  to = "/.netlify/functions/machine?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/document/*"
  to = "/.netlify/functions/document"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true
