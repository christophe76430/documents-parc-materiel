[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Routes explicites pour l'administration
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/admin"
  status = 200
  force = true
